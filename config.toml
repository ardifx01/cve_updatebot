# ============================================================
# CVE Signal - Config (fokus RCE unauth + CMS)
# ============================================================

[scan]
lookback_hours = 6
maximum_cve_age_hours = 48
minimum_cvss = 7.0
maximum_cvss = 10.0
maximum_exploit_matches = 5


# ------------------------------------------------------------
# FILTER: Teknologi / CMS yang dipantau
# CVE harus cocok minimal 1 keyword di sini
# ------------------------------------------------------------
technology_keywords = [
  # CMS
  "joomla",
  "wordpress",
  "laravel",
  "codeigniter",
  "symfony",
  "cakephp",
  "yii",
  "php",

  # Framework
  "apache http server",
  "apache tomcat",
  "nginx",
  "spring framework",
  "struts",
  "jenkins",
  "gitlab",
  "github enterprise",
]


# ------------------------------------------------------------
# FILTER: Sinyal kerentanan
# CVE harus cocok minimal 1 keyword di sini
# ------------------------------------------------------------
vulnerability_keywords = [
  "remote code execution",
  "rce",
  "arbitrary code execution",
  "command injection",
  "code injection",
  "deserialization",
  "authentication bypass",
  "authorization bypass",
  "unauthenticated",
  "pre-auth",
  "pre-authentication",
  "missing authentication",
  "arbitrary file upload",
  "file upload",
  "path traversal",
  "directory traversal",
  "file inclusion",
  "local file inclusion",
  "remote file inclusion",
]


# ------------------------------------------------------------
# FILTER: CWE relevan (RCE / unauth / upload / traversal)
# ------------------------------------------------------------
web_cwes = [
  "CWE-22",   # Path Traversal
  "CWE-78",   # OS Command Injection
  "CWE-94",   # Code Injection
  "CWE-98",   # PHP Remote File Inclusion
  "CWE-287",  # Improper Authentication
  "CWE-288",  # Authentication Bypass Using Alternate Path
  "CWE-306",  # Missing Authentication for Critical Function
  "CWE-434",  # Unrestricted File Upload
  "CWE-502",  # Deserialization of Untrusted Data
]


# ------------------------------------------------------------
# FILTER: Keyword yang dikecualikan
# ------------------------------------------------------------
exclude_keywords = [
  # "wordpress plugin",
]


# ============================================================
# FEEDS
# ============================================================
[feeds]
nvd_url = "https://services.nvd.nist.gov/rest/json/cves/2.0"
exploitdb_csv_url = "https://gitlab.com/exploit-database/exploitdb/-/raw/main/files_exploits.csv"
cisa_kev_url = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"


# ============================================================
# TELEGRAM
# ============================================================
[telegram]
enabled = true
parse_mode = "HTML"
disable_web_page_preview = true


# ============================================================
# OUTPUT
# ============================================================
[output]
state_db_path = "data/state.sqlite3"
verbose = false
